<!DOCTYPE html>
<html>

<body>

<h1>Kadwal Marketplace</h1>

<button onclick="testAPI()">
Show Products
</button>

<pre id="output"></pre>

<script>

function testAPI() {

fetch("https://kadwal-server.onrender.com/products")

.then(response => response.json())

.then(data => {

document.getElementById("output").innerText =
JSON.stringify(data, null, 2);

})

.catch(error => {

document.getElementById("output").innerText =
error;

});

}

</script>

</body>
</html>
