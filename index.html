<!DOCTYPE html>
<html>
<body>

<h1>Kadwal Marketplace</h1>

<button onclick="loadData()">
Load Products
</button>

<div id="products"></div>

<script>

function loadData() {

fetch("https://kadwal-server.onrender.com/products")
.then(res => res.json())
.then(data => {

document.getElementById("products").innerHTML =
JSON.stringify(data);

});

}

</script>

</body>
</html>
