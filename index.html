<script>

function signup() {

const username =
document.getElementById("signupUsername").value;

const password =
document.getElementById("signupPassword").value;

fetch(
"https://kadwal-server.onrender.com/signup",
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
username,
password
})

}
)

.then(response => response.json())

.then(data => {

alert(data.message);

})

.catch(error => {

alert("Signup Error");

});

}

function login() {

const username =
document.getElementById("loginUsername").value;

const password =
document.getElementById("loginPassword").value;

fetch(
"https://kadwal-server.onrender.com/login",
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
username,
password
})

}
)

.then(response => response.json())

.then(data => {

alert(data.message);

})

.catch(error => {

alert("Login Error");

});

}

</script>
