<!DOCTYPE html>
<html>

<head>

<title>Kadwal Marketplace</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

input{
padding:10px;
margin:5px;
width:250px;
}

button{
padding:10px;
background:purple;
color:white;
border:none;
cursor:pointer;
}

.product{
border:1px solid white;
padding:10px;
margin-top:10px;
}

.product img{
margin-top:10px;
border-radius:10px;
}

</style>

</head>

<body>

<h1>Kadwal Marketplace</h1>

<p>Global Marketplace</p>

<h2>Add Product</h2>

<input id="name" placeholder="Product Name">

<input id="price" placeholder="Price">

<input id="image" placeholder="Image URL">

<button onclick="addProduct()">
Add Product
</button>

<div id="products"></div>

<script>

function loadProducts() {

fetch("https://kadwal-server.onrender.com/products")

.then(response => response.json())

.then(data => {

let html = "";

data.forEach(product => {

html += `

<div class="product">

<img src="${product.image}" width="200">

<h2>${product.name}</h2>

<p>Price: $${product.price}</p>

</div>

`;

});

document.getElementById("products").innerHTML = html;

});

}

function addProduct() {

const name =
document.getElementById("name").value;

const price =
document.getElementById("price").value;

const image =
document.getElementById("image").value;

fetch("https://kadwal-server.onrender.com/products", {

method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
name,
price,
image
})

})

.then(response => response.json())

.then(data => {

alert("Product Added");

location.reload();

});

}

loadProducts();

</script>

</body>

</html>
