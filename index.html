<!DOCTYPE html>
<html>

<head>

<title>Kadwal Marketplace</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

input{
padding:10px;
margin:5px;
width:250px;
}

button{
padding:10px;
background:purple;
color:white;
border:none;
cursor:pointer;
margin-top:5px;
}

.product{
border:1px solid white;
padding:10px;
margin-top:10px;
border-radius:10px;
}

.product img{
margin-top:10px;
border-radius:10px;
}

</style>

</head>

<body>

<h1>Kadwal Marketplace</h1>

<p>Global Marketplace</p>

<h2>Signup</h2>

<input id="signupUsername"
placeholder="Username">

<input id="signupPassword"
placeholder="Password"
type="password">

<button onclick="signup()">
Signup
</button>

<h2>Login</h2>

<input id="loginUsername"
placeholder="Username">

<input id="loginPassword"
placeholder="Password"
type="password">

<button onclick="login()">
Login
</button>

<h2>Search Product</h2>

<input id="search"
placeholder="Search product">

<button onclick="searchProducts()">
Search
</button>

<h2>Add Product</h2>

<input id="name"
placeholder="Product Name">

<input id="price"
placeholder="Price">

<input id="image"
placeholder="Image URL">

<input id="category"
placeholder="Category">

<button onclick="addProduct()">
Add Product
</button>

<h2>Products</h2>

<div id="products"></div>

<h2>Cart</h2>

<div id="cart"></div>

<script>

let cart = [];

function loadProducts() {

fetch("https://kadwal-server.onrender.com/products")

.then(response => response.json())

.then(data => {

let html = "";

data.forEach((product, index) => {

html += `

<div class="product">

<img src="${product.image}"
width="200">

<h2>${product.name}</h2>

<p>Price: $${product.price}</p>

<p>Category: ${product.category}</p>

<button onclick="addToCart(
'${product.name}',
'${product.price}'
)">
Add To Cart
</button>

<button onclick="deleteProduct(
'${product._id || index}'
)">
Delete
</button>

</div>

`;

});

document.getElementById("products").innerHTML = html;

});

}

function addProduct() {

const name =
document.getElementById("name").value;

const price =
document.getElementById("price").value;

const image =
document.getElementById("image").value;

const category =
document.getElementById("category").value;

fetch(
"https://kadwal-server.onrender.com/products",

{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
name,
price,
image,
category
})

}

)

.then(response => response.json())

.then(data => {

alert("Product Added");

location.reload();

});

}

function deleteProduct(id) {

fetch(
"https://kadwal-server.onrender.com/products/" + id,

{
method: "DELETE"
}

)

.then(response => response.json())

.then(data => {

alert("Product Deleted");

location.reload();

});

}

function signup() {

const username =
document.getElementById("signupUsername").value;

const password =
document.getElementById("signupPassword").value;

fetch(
"https://kadwal-server.onrender.com/signup",

{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
username,
password
})

}

)

.then(response => response.json())

.then(data => {

alert(data.message);

});

}

function login() {

const username =
document.getElementById("loginUsername").value;

const password =
document.getElementById("loginPassword").value;

fetch(
"https://kadwal-server.onrender.com/login",

{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
username,
password
})

}

)

.then(response => response.json())

.then(data => {

alert(data.message);

});

}

function searchProducts() {

const search =
document.getElementById("search").value.toLowerCase();

fetch(
"https://kadwal-server.onrender.com/products"
)

.then(response => response.json())

.then(data => {

let html = "";

const filtered = data.filter(product =>

product.name.toLowerCase().includes(search)

);

filtered.forEach((product, index) => {

html += `

<div class="product">

<img src="${product.image}"
width="200">

<h2>${product.name}</h2>

<p>Price: $${product.price}</p>

<p>Category: ${product.category}</p>

<button onclick="addToCart(
'${product.name}',
'${product.price}'
)">
Add To Cart
</button>

<button onclick="deleteProduct(
'${product._id || index}'
)">
Delete
</button>

</div>

`;

});

document.getElementById("products").innerHTML = html;

});

}

function addToCart(name, price) {

cart.push({
name,
price
});

renderCart();

}

function renderCart() {

let html = "";

cart.forEach(item => {

html += `

<div class="product">

<h3>${item.name}</h3>

<p>$${item.price}</p>

</div>

`;

});

document.getElementById("cart").innerHTML = html;

}

loadProducts();

</script>

</body>

  </html>
