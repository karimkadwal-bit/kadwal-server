<!DOCTYPE html>
<html>

<head>

<title>Kadwal Marketplace</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

.product{
border:1px solid white;
padding:10px;
margin-top:10px;
}

</style>

</head>

<body>

<h1>Kadwal Marketplace</h1>

<p>Global Marketplace</p>

<div id="products"></div>

<script>

fetch("https://kadwal-server.onrender.com/products")

.then(response => response.json())

.then(data => {

let html = "";

data.forEach(product => {

html += `

<div class="product">

<h2>${product.name}</h2>

<p>Price: $${product.price}</p>

</div>

`;

});

document.getElementById("products").innerHTML = html;

});

</script>

</body>

</html>
