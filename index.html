<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kadwal Marketplace</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<h1>Kadwal Marketplace</h1>

<p>
Buy • Sell • Connect Worldwide
</p>

<div class="card">

<h2>User Account</h2>

<input
id="email"
type="email"
placeholder="Enter Email">

<input
id="password"
type="password"
placeholder="Enter Password">

<button onclick="signup()">
Signup
</button>

<button onclick="login()">
Login
</button>

<hr>

<h2>Add Product</h2>

<input
id="productName"
placeholder="Product Name">

<input
id="productPrice"
placeholder="Product Price">
<select id="productCategory">

  <option value="Electronics">
    Electronics
  </option>

  <option value="Phones">
    Phones
  </option>

  <option value="Cars">
    Cars
  </option>

  <option value="Clothes">
    Clothes
  </option>

  <option value="Books">
    Books
  </option>

</select>
  
<input
id="productImage"
placeholder="Image URL">

<button onclick="addProduct()">
Add Product
</button>

<hr>

<h2>Products List</h2>
<input
id="searchInput"
placeholder="Search Product"
onkeyup="searchProducts()">

  <select
id="filterCategory"
onchange="filterProducts()">

  <option value="All">
    All Categories
  </option>

  <option value="Electronics">
    Electronics
  </option>

  <option value="Phones">
    Phones
  </option>

  <option value="Cars">
    Cars
  </option>

  <option value="Clothes">
    Clothes
  </option>

  <option value="Books">
    Books
  </option>

  </select>
  
<div id="productsList"></div>

<hr>

<h2>Shopping Cart</h2>

<div id="cartList"></div>

<h3 id="totalPrice">
Total: $0
</h3>
<h2>Checkout</h2>

<button onclick="checkout()">
Place Order
</button>

<hr>

<h2>My Orders</h2>

<div id="ordersList"></div>
</div>
</div>

<script src="app.js"></script>

</body>
</html>
