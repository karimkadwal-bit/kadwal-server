<!DOCTYPE html>
<html>

<head>
<title>Kadwal Marketplace</title>

<script src="https://js.stripe.com/v3/"></script>

<style>

body{
background:#000;
color:white;
font-family:Arial;
padding:20px;
}

h1,h2{
text-align:center;
}

input,textarea{
padding:10px;
margin:5px;
width:250px;
background:#111;
color:white;
border:1px solid gray;
border-radius:5px;
}

button{
padding:10px;
background:purple;
color:white;
border:none;
cursor:pointer;
margin-top:5px;
border-radius:5px;
width:auto;
}

button:hover{
opacity:0.8;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
gap:10px;
}

.product{
border:1px solid #444;
padding:10px;
border-radius:10px;
background:#111;
}

.product img{
width:100%;
border-radius:10px;
}

.dashboard{
border:2px solid purple;
padding:15px;
margin:10px 0;
border-radius:10px;
background:#111;
}

.comment{
background:#111;
padding:10px;
margin-top:10px;
border-radius:5px;
}

@media (max-width:768px){

input,button,textarea{
width:100%;
}

}

</style>

</head>

<body>

<h1>Kadwal Marketplace</h1>

<p style="text-align:center;">Global Ecommerce Platform</p>

<!-- ADMIN DASHBOARD -->
<h2>🛠️ Admin Dashboard</h2>

<div class="dashboard">

<p>Total Products: <span id="totalProducts">0</span></p>
<p>Total Orders: <span id="totalOrders">0</span></p>
<p>Total Wishlist: <span id="totalWishlist">0</span></p>

</div>

<!-- PROFILE -->
<h2>User Profile</h2>
<div id="profile"></div>

<!-- AUTH -->
<h2>Signup</h2>
<input id="signupUsername" placeholder="Username">
<input id="signupPassword" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>

<h2>Login</h2>
<input id="loginUsername" placeholder="Username">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<!-- SEARCH -->
<h2>Search Product</h2>
<input id="search" placeholder="Search">
<button onclick="searchProducts()">Search</button>

<!-- ADD PRODUCT -->
<h2>Add Product</h2>
<input id="name" placeholder="Name">
<input id="price" placeholder="Price">
<input id="image" placeholder="Image URL">
<input id="category" placeholder="Category">
<input id="rating" placeholder="Rating">
<button onclick="addProduct()">Add Product</button>

<!-- PRODUCTS -->
<h2>Products</h2>
<div id="products"></div>

<!-- WISHLIST -->
<h2>❤️ Wishlist</h2>
<div id="wishlist"></div>

<!-- CART -->
<h2>🛒 Cart</h2>
<div id="cart"></div>

<button onclick="payNow()">💳 Pay Now</button>

<!-- ORDERS -->
<h2>📦 Orders</h2>
<div id="orders"></div>

<!-- COMMENTS -->
<h2>💬 Comments</h2>
<textarea id="commentText" placeholder="Write comment"></textarea>
<button onclick="addComment()">Add Comment</button>
<div id="comments"></div>

<script>

const stripe = Stripe("pk_test_51THGu9QSw6mP2scgIJYLla2gmYVmkPkSaDICfnA7AN0AOub7HPbZDrRI9vgt4vqTJ8U8qhzdi2OS9Pku7KEoIRnb00mvkR3Yqt");

let cart = [];
let orders = [];
let wishlist = [];
let comments = [];

function payNow(){
if(cart.length === 0){
alert("Cart is empty");
return;
}
alert("Payment system ready 💳 (Stripe Connected)");
}

function updateDashboard(){
document.getElementById("totalOrders").innerText = orders.length;
document.getElementById("totalWishlist").innerText = wishlist.length;
}

function loadProducts(){

fetch("https://kadwal-server.onrender.com/products")
.then(res=>res.json())
.then(data=>{

document.getElementById("totalProducts").innerText = data.length;

let html = "";

data.forEach(p=>{

html += `
<div class="product">
<img src="${p.image}">
<h3>${p.name}</h3>
<p>$${p.price}</p>
<p>${p.category}</p>

<button onclick="addToCart('${p.name}','${p.price}')">Cart</button>
<button onclick="addToWishlist('${p.name}','${p.price}')">❤️</button>

</div>
`;

});

document.getElementById("products").innerHTML = html;

});

}

function addToCart(name,price){
cart.push({name,price});
document.getElementById("cart").innerHTML += `<p>${name} - $${price}</p>`;
updateDashboard();
}

function addToWishlist(name,price){
wishlist.push({name,price});
document.getElementById("wishlist").innerHTML += `<p>${name}</p>`;
updateDashboard();
}

function checkout(){
orders.push(...cart);
cart=[];
document.getElementById("orders").innerHTML += "<p>New Order Placed</p>";
updateDashboard();
}

function addComment(){
let text = document.getElementById("commentText").value;
comments.push(text);
document.getElementById("comments").innerHTML += `<div class="comment">${text}</div>`;
}

function signup(){
alert("Signup OK");
}

function login(){
let user = document.getElementById("loginUsername").value;
alert("Welcome " + user);

document.getElementById("profile").innerHTML =
`<div class="product">Logged in as ${user}</div>`;
}

function searchProducts(){
alert("Search working (UI only)");
}

loadProducts();

</script>

</body>
</html>
