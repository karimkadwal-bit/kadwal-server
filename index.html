<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadwal Marketplace</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Kadwal Marketplace</h1>
<p>Buy • Sell • Connect Worldwide</p>

<div class="card">

<h2>User Account</h2>

<input
id="email"
type="email"
placeholder="Enter Email">

<input
id="password"
type="password"
placeholder="Enter Password">

<button onclick="signup()">
Signup
</button>

<button onclick="login()">
Login
</button>

<hr>

<h2>Add Product</h2>

<input
id="productName"
placeholder="Product Name">

<input
id="productPrice"
placeholder="Product Price">

<button onclick="addProduct()">
Add Product
</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
