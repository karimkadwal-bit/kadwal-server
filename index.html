<!DOCTYPE html>
<html>

<head>

<title>Kadwal Marketplace</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

input{
padding:10px;
margin:5px;
width:250px;
background:#222;
color:white;
border:1px solid gray;
}

button{
padding:10px;
background:purple;
color:white;
border:none;
cursor:pointer;
margin-top:5px;
border-radius:5px;
}

.product{
border:1px solid white;
padding:10px;
margin-top:10px;
border-radius:10px;
}

.product img{
margin-top:10px;
border-radius:10px;
width:200px;
}

.dashboard{
border:2px solid purple;
padding:15px;
margin-top:20px;
border-radius:10px;
background:#111;
}

</style>

</head>

<body>

<h1>Kadwal Marketplace</h1>

<p>Global Marketplace</p>

<h2>🛠️ Admin Dashboard</h2>

<div class="dashboard">

<p>Total Products:
<span id="totalProducts">0</span>
</p>

<p>Total Orders:
<span id="totalOrders">0</span>
</p>

<p>Total Wishlist:
<span id="totalWishlist">0</span>
</p>

</div>

<h2>User Profile</h2>

<div id="profile"></div>

<h2>Signup</h2>

<input id="signupUsername"
placeholder="Username">

<input id="signupPassword"
placeholder="Password"
type="password">

<button onclick="signup()">
Signup
</button>

<h2>Login</h2>

<input id="loginUsername"
placeholder="Username">

<input id="loginPassword"
placeholder="Password"
type="password">

<button onclick="login()">
Login
</button>

<h2>Search Product</h2>

<input id="search"
placeholder="Search product">

<button onclick="searchProducts()">
Search
</button>

<h2>Add Product</h2>

<input id="name"
placeholder="Product Name">

<input id="price"
placeholder="Price">

<input id="image"
placeholder="Image URL">

<input id="category"
placeholder="Category">

<input id="rating"
placeholder="Rating 1-5">

<button onclick="addProduct()">
Add Product
</button>

<h2>Products</h2>

<div id="products"></div>

<h2>❤️ Wishlist</h2>

<div id="wishlist"></div>

<h2>🛒 Cart</h2>

<div id="cart"></div>

<button onclick="checkout()">
Checkout
</button>

<h2>📦 Orders</h2>

<div id="orders"></div>

<script>

let cart = [];

let orders = [];

let wishlist = [];

function updateDashboard(productsCount){

document.getElementById("totalProducts").innerText =
productsCount;

document.getElementById("totalOrders").innerText =
orders.length;

document.getElementById("totalWishlist").innerText =
wishlist.length;

}

function loadProducts() {

fetch("https://kadwal-server.onrender.com/products")

.then(response => response.json())

.then(data => {

let html = "";

updateDashboard(data.length);

data.forEach((product, index) => {

html += `

<div class="product">

<img src="${product.image}">

<h2>${product.name}</h2>

<p>Price: $${product.price}</p>

<p>Category: ${product.category}</p>

<p>Rating: ${product.rating || 5} ⭐</p>

<button onclick="addToCart(
'${product.name}',
'${product.price}'
)">
Add To Cart
</button>

<button onclick="addToWishlist(
'${product.name}',
'${product.price}'
)">
❤️ Favorite
</button>

<button onclick="deleteProduct(
'${product._id || index}'
)">
Delete
</button>

</div>

`;

});

document.getElementById("products").innerHTML = html;

});

}

function addProduct() {

const name =
document.getElementById("name").value;

const price =
document.getElementById("price").value;

const image =
document.getElementById("image").value;

const category =
document.getElementById("category").value;

const rating =
document.getElementById("rating").value;

fetch(
"https://kadwal-server.onrender.com/products",

{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
name,
price,
image,
category,
rating
})

}

)

.then(response => response.json())

.then(data => {

alert("Product Added");

location.reload();

});

}

function deleteProduct(id) {

fetch(
"https://kadwal-server.onrender.com/products/" + id,

{
method: "DELETE"
}

)

.then(response => response.json())

.then(data => {

alert("Product Deleted");

location.reload();

});

}

function signup() {

const username =
document.getElementById("signupUsername").value;

const password =
document.getElementById("signupPassword").value;

fetch(
"https://kadwal-server.onrender.com/signup",

{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
username,
password
})

}

)

.then(response => response.json())

.then(data => {

alert(data.message);

});

}

function login() {

const username =
document.getElementById("loginUsername").value;

const password =
document.getElementById("loginPassword").value;

fetch(
"https://kadwal-server.onrender.com/login",

{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
username,
password
})

}

)

.then(response => response.json())

.then(data => {

alert(data.message);

if(data.message === "Login Successful"){

document.getElementById("profile").innerHTML = `

<div class="product">

<h2>Welcome ${username}</h2>

<p>Status: Online 🟢</p>

</div>

`;

}

});

}

function searchProducts() {

const search =
document.getElementById("search").value.toLowerCase();

fetch(
"https://kadwal-server.onrender.com/products"
)

.then(response => response.json())

.then(data => {

let html = "";

const filtered = data.filter(product =>

product.name.toLowerCase().includes(search)

);

filtered.forEach((product, index) => {

html += `

<div class="product">

<img src="${product.image}">

<h2>${product.name}</h2>

<p>Price: $${product.price}</p>

<p>Category: ${product.category}</p>

<p>Rating: ${product.rating || 5} ⭐</p>

<button onclick="addToCart(
'${product.name}',
'${product.price}'
)">
Add To Cart
</button>

<button onclick="addToWishlist(
'${product.name}',
'${product.price}'
)">
❤️ Favorite
</button>

<button onclick="deleteProduct(
'${product._id || index}'
)">
Delete
</button>

</div>

`;

});

document.getElementById("products").innerHTML = html;

});

}

function addToCart(name, price) {

cart.push({
name,
price
});

renderCart();

updateDashboard(
document.getElementsByClassName("product").length
);

}

function renderCart() {

let html = "";

cart.forEach(item => {

html += `

<div class="product">

<h3>${item.name}</h3>

<p>$${item.price}</p>

</div>

`;

});

document.getElementById("cart").innerHTML = html;

}

function addToWishlist(name, price) {

wishlist.push({
name,
price
});

renderWishlist();

updateDashboard(
document.getElementsByClassName("product").length
);

}

function renderWishlist() {

let html = "";

wishlist.forEach(item => {

html += `

<div class="product">

<h3>${item.name}</h3>

<p>$${item.price}</p>

<p>❤️ Favorite Product</p>

</div>

`;

});

document.getElementById("wishlist").innerHTML = html;

}

function checkout() {

if(cart.length === 0){

alert("Cart is empty");

return;

}

orders.push(...cart);

renderOrders();

cart = [];

renderCart();

updateDashboard(
document.getElementsByClassName("product").length
);

alert("Order Placed");

}

function renderOrders() {

let html = "";

orders.forEach(item => {

html += `

<div class="product">

<h3>${item.name}</h3>

<p>$${item.price}</p>

<p>Status: Ordered</p>

</div>

`;

});

document.getElementById("orders").innerHTML = html;

}

loadProducts();

</script>

</body>

  </html>
