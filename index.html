<!DOCTYPE html>
<html>
<head>
<title>Kadwal Marketplace</title>
<style>
body{background:#000;color:white;font-family:Arial;padding:20px}
input,button{padding:10px;margin:5px}
.product{background:#111;padding:10px;margin:10px;border-radius:10px}
</style>
</head>

<body>

<h1>🔥 Kadwal Marketplace</h1>

<h2>Signup</h2>
<input id="su_user" placeholder="username">
<input id="su_pass" type="password" placeholder="password">
<button onclick="signup()">Signup</button>

<h2>Login</h2>
<input id="li_user" placeholder="username">
<input id="li_pass" type="password" placeholder="password">
<button onclick="login()">Login</button>

<h2>Products</h2>
<div id="products"></div>

<script>

const API = "https://kadwal-server.onrender.com";

let token = localStorage.getItem("token");
let role = localStorage.getItem("role");

// SIGNUP
function signup(){
fetch(API+"/signup",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:su_user.value,
password:su_pass.value
})
}).then(r=>r.json()).then(d=>alert(d.message));
}

// LOGIN
function login(){
fetch(API+"/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:li_user.value,
password:li_pass.value
})
}).then(r=>r.json()).then(d=>{

alert(d.message);

if(d.token){
localStorage.setItem("token",d.token);
localStorage.setItem("role",d.role);

token = d.token;
role = d.role;

loadProducts();
}
});
}

// LOAD PRODUCTS
function loadProducts(){
fetch(API+"/products")
.then(r=>r.json())
.then(data=>{
let html="";
data.forEach(p=>{
html+=`
<div class="product">
<h3>${p.name}</h3>
<p>${p.price}</p>
</div>
`;
});
products.innerHTML = html;
});
}

loadProducts();

</script>

</body>
</html>
