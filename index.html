<script>

const API =
"https://kadwal-server.onrender.com";

const stripe = Stripe(
"pk_test_51THGu9QSw6mP2scgIJYLla2gmYVmkPkSaDICfnA7AN0AOub7HPbZDrRI9vgt4vqTJ8U8qhzdi2OS9Pku7KEoIRnb00mvkR3Yqt"
);

let token =
localStorage.getItem("token");

let userRole =
localStorage.getItem("role");

let cart = [];

let wishlist = [];

let comments = [];

let orders = [];

function updateDashboard(productsCount){

document.getElementById("totalProducts").innerText =
productsCount;

document.getElementById("totalOrders").innerText =
orders.length;

document.getElementById("totalWishlist").innerText =
wishlist.length;

}

function signup(){

const username =
document.getElementById("signupUsername").value;

const password =
document.getElementById("signupPassword").value;

fetch(API + "/signup",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

});

}

function login(){

const username =
document.getElementById("loginUsername").value;

const password =
document.getElementById("loginPassword").value;

fetch(API + "/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

if(data.token){

localStorage.setItem(
"token",
data.token
);

localStorage.setItem(
"role",
data.role
);

token = data.token;

userRole = data.role;

document.getElementById("profile").innerHTML = `

<div class="product">

<h2>Welcome ${username}</h2>

<p>Role: ${data.role}</p>

<p>Status: Online 🟢</p>

<button onclick="logout()">
Logout
</button>

</div>

`;

}

});

}

function logout(){

localStorage.removeItem("token");

localStorage.removeItem("role");

location.reload();

}

function loadProducts(){

fetch(API + "/products")

.then(res=>res.json())

.then(data=>{

let html = "";

updateDashboard(data.length);

data.forEach((product,index)=>{

html += `

<div class="product">

<img src="${product.image}">

<h3 onclick='showProductDetails(
${JSON.stringify(product)}
)'
style="cursor:pointer;color:cyan;">

${product.name}

</h3>

<p>💰 Price: $${product.price}</p>

<p>📂 ${product.category}</p>

<p>⭐ ${product.rating || 5}</p>

<button onclick="addToCart(
'${product.name}',
'${product.price}'
)">
Add To Cart
</button>

<button onclick="addToWishlist(
'${product.name}',
'${product.price}'
)">
❤️ Favorite
</button>

<button onclick="deleteProduct(
'${product._id || index}'
)">
Delete
</button>

</div>

`;

});

document.getElementById("products").innerHTML =
html;

});

}

function showProductDetails(product){

document.getElementById("productDetails").innerHTML = `

<div class="product">

<img src="${product.image}">

<h2>${product.name}</h2>

<p>💰 Price: $${product.price}</p>

<p>📂 Category: ${product.category}</p>

<p>⭐ Rating: ${product.rating || 5}</p>

<p>

Professional ecommerce product
inside Kadwal Marketplace 🚀

</p>

<button onclick="addToCart(
'${product.name}',
'${product.price}'
)">
Add To Cart
</button>

</div>

`;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

function addProduct(){

if(userRole !== "admin"){

alert("Admin Only ❌");

return;

}

const name =
document.getElementById("name").value;

const price =
document.getElementById("price").value;

const image =
document.getElementById("image").value;

const category =
document.getElementById("category").value;

const rating =
document.getElementById("rating").value;

fetch(API + "/products",{

method:"POST",

headers:{
"Content-Type":"application/json",
"authorization":token
},

body:JSON.stringify({
name,
price,
image,
category,
rating
})

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

loadProducts();

});

}

function deleteProduct(id){

if(userRole !== "admin"){

alert("Admin Only ❌");

return;

}

fetch(API + "/products/" + id,{

method:"DELETE",

headers:{
"authorization":token
}

})

.then(res=>res.json())

.then(data=>{

alert(data.message);

loadProducts();

});

}

function searchProducts(){

const search =
document.getElementById("search").value.toLowerCase();

fetch(API + "/products")

.then(res=>res.json())

.then(data=>{

let html = "";

const filtered = data.filter(product =>

product.name.toLowerCase().includes(search)

);

filtered.forEach(product=>{

html += `

<div class="product">

<img src="${product.image}">

<h3 onclick='showProductDetails(
${JSON.stringify(product)}
)'
style="cursor:pointer;color:cyan;">

${product.name}

</h3>

<p>$${product.price}</p>

<p>${product.category}</p>

<button onclick="addToCart(
'${product.name}',
'${product.price}'
)">
Cart
</button>

</div>

`;

});

document.getElementById("products").innerHTML =
html;

});

}

function addToCart(name,price){

cart.push({
name,
price
});

renderCart();

}

function renderCart(){

let html = "";

cart.forEach(item=>{

html += `

<div class="product">

<h3>${item.name}</h3>

<p>$${item.price}</p>

</div>

`;

});

document.getElementById("cart").innerHTML =
html;

}

function addToWishlist(name,price){

wishlist.push({
name,
price
});

renderWishlist();

}

function renderWishlist(){

let html = "";

wishlist.forEach(item=>{

html += `

<div class="product">

<h3>${item.name}</h3>

<p>$${item.price}</p>

<p>❤️ Favorite</p>

</div>

`;

});

document.getElementById("wishlist").innerHTML =
html;

}

function addComment(){

const text =
document.getElementById("commentText").value;

comments.push(text);

renderComments();

document.getElementById("commentText").value =
"";

}

function renderComments(){

let html = "";

comments.forEach(comment=>{

html += `

<div class="comment">

<p>${comment}</p>

</div>

`;

});

document.getElementById("comments").innerHTML =
html;

}

function payNow(){

if(cart.length === 0){

alert("Cart Empty ❌");

return;

}

alert(
"Stripe Payment Connected 💳"
);

}

loadProducts();

  </script>
