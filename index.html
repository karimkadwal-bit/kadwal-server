<!DOCTYPE html>
<html>
<head>
  <title>Kadwal Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Kadwal Marketplace 🚀</h1>

<p>Global marketplace</p>

<div id="products"></div>

<script>

async function loadProducts() {

  const response = await fetch(
    "https://kadwal-server.onrender.com/products"
  );

  const products = await response.json();

  let html = "";

  products.forEach((item) => {

    html += `
      <div>
        <h2>${item.name}</h2>
        <p>$${item.price}</p>
      </div>
    `;

  });

  document.getElementById("products").innerHTML = html;
}

loadProducts();

</script>

</body>
</html>
